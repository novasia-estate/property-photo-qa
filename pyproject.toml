[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "property-photo-qa"
version = "1.0.0"
description = "Offline property photography preflight with duplicate review, metadata flags and private HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NovAsia Estate"}]
dependencies = ["Pillow>=10,<13"]
[project.scripts]
property-photo-qa = "property_photo_qa.cli:main"
[project.urls]
Homepage = "https://novasia.estate/"
Source = "https://github.com/novasia-estate/property-photo-qa"
[tool.setuptools.packages.find]
where = ["src"]
